# ---------------------------------------------------------- agent (over SSE)

# These go out to the user inside the SSE stream, on a Reactor thread, so they
# come from the Messages carried by AgentRun — never from LocaleContextHolder.
agent.budgetExhausted=I’ve taken this task {0} steps without wrapping up, so I’m stopping here rather than burning through more. Try being more specific, or split it into a few steps and I’ll keep going.
agent.busy=The previous task in this conversation is still running. Wait for it to finish before sending another (or start a new conversation).
agent.modelFailed=Sorry — something went wrong calling the model: {0}. Please try again in a moment.
agent.toolFailed=Sorry — something went wrong running a tool: {0}. Try rephrasing and sending it again.
agent.retrievalSkipped=Knowledge search: no searchable question this turn, skipped
agent.retrievalFailed=Knowledge search failed ({0}); no reference material this turn, other tools can still be used
agent.retrievalOffTopic=Knowledge search: unrelated to the knowledge base, no search was run
agent.retrievalNoHits=Knowledge search “{0}”: 0 hits
agent.retrievalHits=Knowledge search “{0}”: {1} hit(s) ({2}) · {3}ms

agent.step=Step {0}

# Written on one line with \n escapes on purpose — a raw line break inside a
# .properties entry starts a NEW entry, so the rest of this text would silently
# become keys of its own. See the note in messages.properties.
agent.hint=## Important (the system detected you going in circles)\nYou just did the same thing {0} steps in a row: {1}.\nRepeating the same action will not produce a different result. Change approach now:\n- Change the arguments or the tool: if the goal isn't met, the previous approach is probably wrong to begin with;\n- Break the task differently: split what one step can't finish into smaller steps;\n- If what's missing is something only the user knows (preferences, constraints, goal), ask them with askHuman — don't guess, and don't just try the same thing again.\nThe next step must be different from everything you've tried.

agent.abort=I couldn't finish this task: {0} steps in a row repeated the same action ({1}), and pushing further would very likely give the same result — so I'm stopping here rather than burning through more.\nThe {2} steps I did run are all in this conversation. You could:\n- rephrase the goal more concretely and I'll pick it up again;\n- or split the task and have me do just one part first.
agent.askUser=I repeated the same action {0} times on this task ({1}), and rephrasing didn't move it forward.\nI need a bit more from you before I can try a different direction.
agent.askUserLastWords=\nMy most recent thinking was: {0}
agent.askUserTail=\nYou can just tell me: what the goal of this task is, any constraints I have to respect, or which step you'd like me to do first.

agent.answerPrefix=(In your last turn you asked the user this: “{0}”. Their answer is below.)\n{1}

slim.image.defaultQuestion=Please take a look at this image and tell me how it relates to my health.
error.streamFailed=Something went wrong on our side — please try again in a moment.

