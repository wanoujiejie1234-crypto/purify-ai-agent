# English copy. Picked by the request's Accept-Language header
# (Spring Boot's default AcceptHeaderLocaleResolver).
#
# Every key here must exist in messages.properties too — a missing one does not
# fail at startup. It only shows up when a user switches language and actually
# hits that branch, and what they see is the bare key (see i18n/Messages).
#
# Keep the {0} / {1} placeholders: the argument order is part of the contract
# with the call site, and reordering them here silently swaps the values.
#
# See messages.properties for the list of things that are deliberately NOT
# translated (knowledge-base categories, ActivityLevel labels, tool
# descriptions). Those are data, not copy, and translating them changes
# behaviour rather than appearance.

