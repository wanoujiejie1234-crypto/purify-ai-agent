# ---- Bailian sync (the card on the knowledge-base admin page) ----
# error.kb.upstream is an **upstream** failure — Bailian timed out, rate-limited us, or this
# access key lacks permission. It returns 502, not 400: reporting 400 would send the user off
# to rename files or change categories, where nothing they change can help. See UpstreamException.
error.kb.bailianNotConfigured=Bailian sync isn’t configured yet; missing: {0}. Please add these to application-local.yml.
error.kb.bailianNoSelection=Please select at least one document to sync
error.kb.bailianPageSizeTooLarge=At most {0} per page, got {1} — that’s a hard limit of the Bailian API
error.kb.bailianChunkLimitExceeded=This document has more chunks on Bailian than the local per-document limit of {0}. Please split the document, or raise purify.rag.pgvector.chunk.max-num-chunks: {1}
error.kb.bailianNotReady=This document has no chunks on Bailian yet (it may still be parsing). Try again once it finishes: {0}
error.kb.bailianClassificationMissing=Bailian didn’t tag this document’s chunks with a category, so we can’t pick one automatically. Please choose one when syncing: {0}
error.kb.bailianClassificationAmbiguous=This document’s chunks carry more than one category ({1}), so we can’t pick one automatically. Please choose one when syncing: {0}
error.kb.upstream=The Bailian API call failed ({0}): {1}

