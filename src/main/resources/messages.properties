# 中文文案。默认语言 —— 没带 Accept-Language、或者带了中文的请求都走这一份。
#
# 英文在 messages_en.properties，**两个文件的键必须一一对应**。
# 少一条不会在启动时报错，只会在用户切到那种语言、并且真的触发那条分支时才暴露，
# 而那时候界面上显示的会是键本身（见 i18n/Messages 的兜底）。
#
# 编码必须是 UTF-8。Spring Boot 的 spring.messages.encoding 默认就是 UTF-8，
# 但编辑器把它存成 GBK 的话，界面上会是一串乱码、而且不报错——改完这个文件
# 顺手确认一下编码。
#
# ============================================================================
# 这里**不翻**三类东西。它们是数据不是展示，翻了会改变程序行为：
#
#   1. 知识库分类（purify.rag.router.categories 的 value）——
#      写进了 pgvector 的元数据，还被当作等值过滤条件用（「字段 = 值」）。
#      翻掉之后已经入库的文档一份都检索不到，而界面上看不出任何异常。
#   2. ActivityLevel 的 label —— 后端拿 label 当匹配依据（ActivityLevel.parse），
#      翻了用户画像就回写不进库。
#   3. @Tool / @ToolParam 的描述和工具返回的文本 —— 那是写给模型的指令，
#      翻了会改变智能体的行为。它们也不在 messages*.properties 里，而是散在
#      tools/ 下面，改的时候要认出来。
#
# 另外，agent.* 那几条是**智能体在 SSE 流里推给用户看的话**，
# 它跑在 Reactor 线程上，拿不到请求线程的语言 —— 由 AgentRun 带着 Messages 走，
# 见 agent/AgentRun 和 i18n/Messages 的注释。
# ============================================================================

