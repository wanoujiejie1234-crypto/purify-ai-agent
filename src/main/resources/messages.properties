# ---------------------------------------------------------------- 资料库

error.resource.notFound=这条记录不存在或已被删除。
# 后端一起翻译：它是纯展示用的枚举标签，不参与任何匹配。
# 前端不维护「枚举名 → 文案」的映射，漏一项就会在界面上直接露出 WRITTEN 这种内部名。
resource.kind.PDF=生成的 PDF
resource.kind.DOWNLOAD=下载的资源
resource.kind.WRITTEN=写出的文件

# ------------------------------------------------------------ 智能体（SSE）

# 这几条会通过 SSE 推给用户看，跑在 Reactor 线程上，
# 所以只能靠 AgentRun 带下来的 Messages 取，不能读 LocaleContextHolder。
agent.budgetExhausted=这个任务我已经连着做了 {0} 步还没收尾，先停在这里，免得一直耗下去。你可以把要求说得更具体一点，或者把任务拆成几步，我接着做。
agent.busy=这个会话上一个任务还没跑完，等它结束再发下一条吧（或者换一个会话 ID 重新开始）。
agent.modelFailed=抱歉，调用模型时出错了：{0}。可以稍后再试一次。
agent.toolFailed=抱歉，执行工具时出错了：{0}。可以换个说法再试一次。
agent.retrievalSkipped=知识库检索：本轮没有可检索的问题，已跳过
agent.retrievalFailed=知识库检索失败（{0}），本轮没有参考资料，可改用其它工具
agent.retrievalOffTopic=知识库检索：与知识库无关，未发起检索
agent.retrievalNoHits=知识库检索「{0}」：命中 0 条
agent.retrievalHits=知识库检索「{0}」：命中 {1} 条（{2}）· 耗时 {3}ms

# SSE 里每一步开头的那个序号
agent.step=第 {0} 步

# 「看门狗」两档处置的话术。这两段是**对用户说的**，所以跟着语言走。
#
# 这条是多行的，所以整段写在**一行**里、换行用 \n 转义。
# 千万不要在这里直接换行：.properties 里一行就是一条记录，中间换行之后
# 后面那几行会被当成**新的键**（键名就是那句中文），
# 表现是这段提示只发出第一行、剩下的全丢，而且不报任何错。
# （MessageBundleParityTest 会抓住这种错，但知道原因能省一次排查。）
agent.hint=## 重要提醒（系统检测到你在原地打转）\n你刚才连续 {0} 步做了同一件事：{1}。\n重复同样的操作不会得到不同的结果。请立刻换一个思路，具体来说：\n- 换参数或换工具：目标没达成，多半是上一步的做法本身不对；\n- 换个角度拆任务：把一步做不完的事拆成几步能做的小事；\n- 如果缺的是只有用户才知道的信息（偏好、约束、目标），用 askHuman 直接问他，不要靠猜、也不要再试一遍。\n下一步必须是和前面不同的做法。

agent.abort=这个任务我没能做完：连续 {0} 步都在重复同样的操作（{1}），再试下去大概率还是同样的结果，我先停在这里，不继续消耗了。\n已经跑过的 {2} 步都在这个会话里，你可以：\n- 换一种说法把目标讲得更具体一点，我接着试；\n- 或者把任务拆小，先让我做其中一步。
agent.askUser=我在这个任务上连续 {0} 次重复了同样的操作（{1}），换个说法也没能推进。\n需要你补充一点信息，我才能换个方向继续。
agent.askUserLastWords=\n我最近一次的想法是：{0}
agent.askUserTail=\n你可以直接告诉我：这个任务的目标是什么、有没有必须遵守的条件，或者你更希望我先做哪一步。

# 续跑时补在用户那句话前面的说明。它是**发给模型的**，所以也要跟着语言走：
# 英文用户回一句 "yes" 的时候，模型不该看到一句中文的上下文交代。
agent.answerPrefix=（你上一轮向用户提了这个问题：「{0}」，下面是用户的回答）\n{1}

# ---------------------------------------------------------- 轻语看图 / 流式兜底

slim.image.defaultQuestion=请帮我看看这张图片，说说和我的健康管理有什么关系。
# 流式链路的兜底错误。和 agent.modelFailed 不同：那条是模型调用失败，
# 这条是「流本身出了意外」（编码失败、传输中断），智能体那边也用它
error.streamFailed=服务暂时出了点问题，请稍后再试。

# ---------------------------------------------------------------- 验证码邮件

# 邮件是直接送到用户收件箱的，所以标题和正文也得跟着语言走。
# {0} 是六位验证码。正文里刻意保持朴素（纯文本、验证码单独一行），
# 理由见 EmailSender#bodyOf
auth.mail.subjectRegister=【Purify AI】注册验证码
auth.mail.subjectReset=【Purify AI】找回密码验证码

auth.mail.bodyRegister=你正在注册账号，验证码是：\n\n{0}\n\n验证码 10 分钟内有效，请勿转发给他人。\n如果这不是你本人操作的，忽略这封邮件即可，你的账号不会有任何变化。
auth.mail.bodyReset=你正在重置密码，验证码是：\n\n{0}\n\n验证码 10 分钟内有效，请勿转发给他人。\n如果这不是你本人操作的，忽略这封邮件即可，你的账号不会有任何变化。
